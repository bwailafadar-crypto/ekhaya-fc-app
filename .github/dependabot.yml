# Weekly checks for out-of-date / vulnerable dependencies. Opens small PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      all-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /functions
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
