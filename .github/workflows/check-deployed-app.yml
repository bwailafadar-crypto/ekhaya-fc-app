name: Check deployed app
on: { workflow_dispatch: {} }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm the live bundle contains the new Predictor
        run: |
          set -e
          B="https://ekhaya-fc-app.web.app"
          curl -s "$B/index.html" -o index.html
          # Collect all JS asset names from index, then from each of those (one level deep),
          # since pages are lazy-loaded chunks referenced inside the main bundle.
          grep -oE '/assets/[A-Za-z0-9_.-]+\.js' index.html | sort -u > lvl1.txt
          : > all.txt; cat lvl1.txt >> all.txt
          while read -r a; do
            curl -s "$B$a" -o part.js || continue
            grep -oE 'assets/[A-Za-z0-9_.-]+\.js' part.js | sed 's#^#/#' >> all.txt || true
          done < lvl1.txt
          sort -u all.txt > assets.txt
          echo "::notice::total JS chunks discovered: $(wc -l < assets.txt)"
          found=no; where=""
          while read -r a; do
            curl -s "$B$a" -o c.js || continue
            if grep -q "Win an Ekhaya jersey" c.js || grep -q "Points table" c.js; then found=yes; where="$a"; fi
          done < assets.txt
          echo "::notice::NEW Predictor code live on server: $found ${where}"
          # Also show the index's built timestamp hint (the main entry hash).
          echo "::notice::entry chunk: $(grep -oE '/assets/index-[A-Za-z0-9_.-]+\.js' index.html | head -1)"
