name: Dump user state
on:
  workflow_dispatch:
    inputs:
      email:
        description: Email to inspect
        required: true
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Write key
        env: { FIREBASE_SA: "${{ secrets.FIREBASE_SA }}" }
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Dump
        env: { EMAIL: "${{ inputs.email }}" }
        run: node scripts/dump-user.cjs
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
