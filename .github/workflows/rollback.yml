# If a new version breaks the app, this puts the live site back to an earlier
# release in about a minute. Same link; the database is not touched.
name: Roll back the app
on:
  workflow_dispatch:
    inputs:
      steps:
        description: How many releases to go back (1 = the one before now)
        default: '1'
jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write key
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Roll back
        env:
          STEPS: ${{ inputs.steps }}
        run: node scripts/rollback-site.cjs
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
