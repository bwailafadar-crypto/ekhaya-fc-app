name: E2E payment test
on:
  workflow_dispatch:
    inputs:
      email: { description: Account email, required: true }
      phone: { description: Phone to pay from (0XXXXXXXXX), required: true }
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Run end-to-end payment
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          APP_ENV: ${{ secrets.APP_ENV }}
          EMAIL: ${{ inputs.email }}
          PHONE: ${{ inputs.phone }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf '%s' "$APP_ENV" > "$RUNNER_TEMP/.env"
          export FB_API_KEY=$(grep -E '^VITE_FIREBASE_API_KEY=' "$RUNNER_TEMP/.env" | head -1 | cut -d= -f2- | tr -d '"'\''\r')
          node scripts/e2e-pay.cjs
          rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/.env"
