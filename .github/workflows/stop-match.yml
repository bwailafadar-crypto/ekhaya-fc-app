# Puts a match that was started too early back to "upcoming" (line-up kept).
name: Stop a match started too early

on:
  workflow_dispatch:
    inputs:
      match_id:
        description: 'Match id, e.g. 2026-10-25-ekhaya-fc-v-blue-eagles'
        required: true
      mode:
        description: 'preview = show only, apply = stop it'
        type: choice
        options: [preview, apply]
        default: preview

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write key
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Stop match
        env:
          MATCH_ID: ${{ inputs.match_id }}
        run: |
          ARGS=""
          [ "${{ inputs.mode }}" = "apply" ] && ARGS="--apply"
          node scripts/stop-match.cjs "$MATCH_ID" $ARGS
      - name: Refresh shared fan data
        if: inputs.mode == 'apply'
        run: node scripts/publish-snapshot.cjs
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
