name: Verify charge
on:
  workflow_dispatch:
    inputs:
      email: { description: Account email, required: true }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Verify
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          PAYCHANGU_SECRET_KEY: ${{ secrets.PAYCHANGU_SECRET_KEY }}
          EMAIL: ${{ inputs.email }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node scripts/verify-charge.cjs
          rm -f "$RUNNER_TEMP/sa.json"
