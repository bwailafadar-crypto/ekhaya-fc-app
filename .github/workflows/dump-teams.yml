name: Dump teams
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Write key
        env: { FIREBASE_SA: "${{ secrets.FIREBASE_SA }}" }
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: node scripts/dump-teams.cjs
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
