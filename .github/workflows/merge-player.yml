# Merges a duplicate player into the right one across all live data.
name: Merge duplicate player
on:
  workflow_dispatch:
    inputs:
      keep:
        description: Player id to keep
        required: true
      drop:
        description: Duplicate player id to remove
        required: true
      mode:
        type: choice
        options: [preview, apply]
        default: preview
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write key
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Merge
        env:
          KEEP: ${{ inputs.keep }}
          DROP: ${{ inputs.drop }}
        run: |
          ARGS=""
          [ "${{ inputs.mode }}" = "apply" ] && ARGS="--apply"
          node scripts/merge-player.cjs $ARGS
      - name: Refresh shared fan data
        if: inputs.mode == 'apply'
        run: node scripts/publish-snapshot.cjs
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
