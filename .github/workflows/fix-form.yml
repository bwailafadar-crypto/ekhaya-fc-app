# Puts every team's last-5 form (with the match behind each letter and the
# next match) into the live table, worked out from the league results.
# Only form details change: points and positions are never touched.
name: Fix table form

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = show changes only, apply = save them'
        type: choice
        options: [preview, apply]
        default: preview

jobs:
  form:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write key
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Fix form
        run: |
          ARGS=""
          [ "${{ inputs.mode }}" = "apply" ] && ARGS="--apply"
          node scripts/fix-form.cjs $ARGS
      - name: Refresh shared fan data
        if: inputs.mode == 'apply'
        run: node scripts/publish-snapshot.cjs
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
