# Ekhaya TV: brings new videos from the club's YouTube channel into the app.
# Runs every hour from 6:17 to 22:17 (Malawi time) and when "Sync now" is tapped in the app.
name: Sync YouTube to Ekhaya TV
on:
  schedule:
    - cron: '17 4-20 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Channel link to connect (leave empty to just sync)
        required: false
        default: ''
concurrency:
  group: sync-youtube
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Write key
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Sync
        env:
          CHANNEL: ${{ inputs.channel }}
        run: node scripts/sync-youtube.cjs
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
