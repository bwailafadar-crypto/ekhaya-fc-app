# Robot check of the live app: a temporary test fan signs in and opens every
# page; problems are listed and screenshots saved (download from the run page).
name: Live app check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the test browser
        run: npm i --no-save --ignore-scripts playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Write key
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Check every page
        run: node scripts/site-check.cjs
      - name: Keep screenshots (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-check-${{ github.run_number }}
          path: site-check/
          retention-days: 7
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
