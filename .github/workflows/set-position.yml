name: Set position
on:
  workflow_dispatch:
    inputs:
      player: { description: "Player name", required: true }
      pos: { description: "GK/DEF/MID/FWD", required: true }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts/set-position.cjs, sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i firebase-admin@12 --no-save --no-audit --no-fund
      - name: Write key
        env: { FIREBASE_SA: "${{ secrets.FIREBASE_SA }}" }
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: node scripts/set-position.cjs
        env: { PLAYER: "${{ github.event.inputs.player }}", POS: "${{ github.event.inputs.pos }}" }
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
