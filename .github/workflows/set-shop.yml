# Set shop settings (shopSettings/main) without a deploy. Superadmin-triggered.
name: Set shop settings
on:
  workflow_dispatch:
    inputs:
      settings:
        description: 'JSON of settings to set, e.g. {"payMode":"live"}'
        type: string
        required: true

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/set-shop.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i firebase-admin@12 --no-save --no-audit --no-fund
      - name: Write key
        env: { FIREBASE_SA: "${{ secrets.FIREBASE_SA }}" }
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Set settings
        env:
          SHOP_JSON: ${{ github.event.inputs.settings }}
        run: node scripts/set-shop.cjs
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
