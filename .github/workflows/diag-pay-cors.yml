name: Diagnose payment CORS
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Inspect access protection fields
        env: { TOKEN: "${{ secrets.NETLIFY_AUTH_TOKEN }}" }
        run: node scripts/diag-netlify.cjs
