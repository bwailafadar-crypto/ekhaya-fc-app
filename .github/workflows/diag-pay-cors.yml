name: Diagnose payment CORS
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Preflight (OPTIONS) from the app origin
        run: |
          pre=$(curl -sS -i -X OPTIONS "https://ekhaya-pay.netlify.app/.netlify/functions/shop-pay-start" \
            -H "Origin: https://ekhaya-fc-app.web.app" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization, content-type" \
            --max-time 25 2>&1 | grep -iE "^HTTP|access-control|vary" | tr '\n' ' | ')
          echo "::notice::PREFLIGHT: ${pre:-NO RESPONSE}"
          post=$(curl -sS -i -X POST "https://ekhaya-pay.netlify.app/.netlify/functions/shop-pay-start" \
            -H "Origin: https://ekhaya-fc-app.web.app" \
            -H "content-type: application/json" \
            -d '{}' --max-time 25 2>&1 | grep -iE "^HTTP|access-control|error" | tr '\n' ' | ')
          echo "::notice::POST-NOAUTH: ${post:-NO RESPONSE}"
