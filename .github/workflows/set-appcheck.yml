name: App Check enforcement
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [report, enforce, unenforce]
        default: report
      service:
        description: Service (firestore.googleapis.com, identitytoolkit.googleapis.com)
        default: firestore.googleapis.com
jobs:
  appcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Write key
        env: { FIREBASE_SA: "${{ secrets.FIREBASE_SA }}" }
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Run
        env: { MODE: "${{ inputs.mode }}", SERVICE: "${{ inputs.service }}" }
        run: node scripts/set-appcheck.cjs
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
