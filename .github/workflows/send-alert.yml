# Sends one push alert to fans. Triggered by the admin app (free, no Blaze plan).
# Can also be run by hand from the Actions tab to send a test alert.
name: Send alert
run-name: "Alert: ${{ inputs.title }}"

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'match, news, player, broadcast or test'
        type: choice
        options: [match, news, player, broadcast, test]
        default: test
      title:
        description: 'Alert title'
        required: true
        default: 'Ekhaya FC test alert'
      body:
        description: 'Alert text'
        required: false
        default: 'Alerts are working.'
      path:
        description: 'Page to open, e.g. /live or /news/abc'
        required: false
        default: '/'
      player:
        description: 'Player id (player alerts: fans following him; match alerts: skip his followers)'
        required: false
        default: ''

concurrency:
  group: send-alert
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: alerts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alerts/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: alerts
      - name: Send
        working-directory: alerts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          KIND: ${{ inputs.kind }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          LINK_PATH: ${{ inputs.path }}
          PLAYER: ${{ inputs.player }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node send.cjs --kind "$KIND" --title "$TITLE" --body "$BODY" --path "$LINK_PATH" --player "$PLAYER"
          rm -f "$RUNNER_TEMP/sa.json"
