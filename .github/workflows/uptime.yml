# Checks every 6 hours that the live app is up. If it fails, GitHub emails you.
name: Uptime check

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Live site responds with the app
        run: node scripts/smoke-test.cjs https://ekhaya-fc-app.web.app/
